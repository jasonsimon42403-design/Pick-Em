<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Family Pick'Em</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--sf:#1a1d27;--s2:#1e2233;--s3:#252a3a;--br:rgba(255,255,255,0.07);--b2:rgba(255,255,255,0.13);--ac:#e8c84a;--a2:#4a90e8;--tx:#eef0f8;--mu:#7a82a0;--dn:#e85a4a;--ok:#3dd68c;--wn:#e89a4a;--fd:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px}
*{-webkit-tap-highlight-color:transparent}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--br);background:var(--sf);flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50}
.logo{font-family:var(--fd);font-size:22px;font-weight:900;letter-spacing:1px;color:var(--ac);text-transform:uppercase}
.logo span{color:var(--tx)}
.vtog{display:flex;background:var(--bg);border-radius:7px;padding:3px;gap:2px}
.vbtn{padding:5px 12px;border:none;border-radius:5px;cursor:pointer;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:transparent;color:var(--mu);transition:all .15s}
.vbtn.on{background:var(--ac);color:#000}
.sporttabs{display:flex;padding:0 16px;background:var(--sf);border-bottom:1px solid var(--br);overflow-x:auto;gap:0;scrollbar-width:none}
.sporttabs::-webkit-scrollbar{display:none}
.stab{padding:10px 13px;border:none;background:transparent;color:var(--mu);cursor:pointer;font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
.stab.on{color:var(--ac);border-bottom-color:var(--ac)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtab{padding:5px 11px;border-radius:6px;border:1px solid var(--br);background:transparent;color:var(--mu);cursor:pointer;font-family:var(--fd);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;transition:all .15s}
.subtab.on{background:var(--ac);color:#000;border-color:var(--ac)}
.main{padding:14px 16px;max-width:1200px;margin:0 auto}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-family:var(--fd);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.bp{background:var(--ac);color:#000}.bp:hover{filter:brightness(1.1)}
.bs{background:var(--s2);color:var(--tx);border:1px solid var(--br)}.bs:hover{border-color:var(--b2)}
.bd{background:transparent;color:var(--dn);border:1px solid var(--dn)}.bd:hover{background:var(--dn);color:#fff}
.bg_{background:transparent;color:var(--mu);border:1px solid var(--br)}.bg_:hover{color:var(--tx)}
.bw{background:transparent;color:var(--wn);border:1px solid var(--wn)}.bw:hover{background:var(--wn);color:#000}
.btn-sm{padding:4px 9px;font-size:10px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.st{font-family:var(--fd);font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.st small{font-size:12px;font-weight:400;color:var(--mu);margin-left:6px;text-transform:none;letter-spacing:0}
.gcard{background:var(--sf);border:1px solid var(--br);border-radius:10px;overflow:hidden;margin-bottom:9px}
.gmeta{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg);border-bottom:1px solid var(--br);flex-wrap:wrap}
.gmi{font-size:10px;color:var(--mu)}.gmi b{color:var(--tx);font-weight:600}
.gnet{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--ac);background:rgba(232,200,74,.1);padding:2px 6px;border-radius:4px;border:1px solid rgba(232,200,74,.3)}
.gspd{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--wn);background:rgba(232,154,74,.1);padding:2px 6px;border-radius:4px;border:1px solid rgba(232,154,74,.3)}
.gteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.tside{display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:5px;cursor:pointer;transition:background .15s;min-width:0}
.tside:hover:not(.tlk){background:rgba(255,255,255,.04)}
.tside.tpk{background:rgba(232,200,74,.11);border-bottom:2px solid var(--ac)}
.tside.twn{background:rgba(61,214,140,.09)}
.tside.ttie{background:rgba(74,144,232,.09)}
.tside.tls{opacity:.38}
.tside.tlk{cursor:default}
.tlogo{width:44px;height:44px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--br);flex-shrink:0}
.tlogo img{width:34px;height:34px;object-fit:contain}
.tfall{font-family:var(--fd);font-size:11px;font-weight:800;color:var(--mu);text-align:center;line-height:1}
.tseed{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--ac);text-align:center}
.tname{font-family:var(--fd);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;text-align:center;word-break:break-word}
.trec{font-size:10px;color:var(--mu);text-align:center;margin-top:-2px}
.pbadge{font-size:9px;font-weight:700;font-family:var(--fd);letter-spacing:.4px;padding:2px 5px;border-radius:3px;text-transform:uppercase}
.pbmy{background:var(--ac);color:#000}.pbwin{background:var(--ok);color:#000}.pbtie{background:var(--a2);color:#fff}
.vscol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 5px;min-width:44px;border-left:1px solid var(--br);border-right:1px solid var(--br)}
.vst{font-family:var(--fd);font-size:14px;font-weight:800;color:var(--mu)}
.gfoot{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--br);background:var(--bg);gap:6px;flex-wrap:wrap}
.tally{font-size:10px;color:var(--mu)}.tally b{color:var(--tx);font-weight:600}
.lkban{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:7px;margin-bottom:12px;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.lbon{background:rgba(61,214,140,.09);border:1px solid var(--ok);color:var(--ok)}
.lblock{background:rgba(232,90,74,.1);border:1px solid var(--dn);color:var(--dn)}
.bwrap{overflow-x:auto;padding-bottom:10px}
.brow{display:flex;gap:0;min-width:max-content;position:relative}
.bround{display:flex;flex-direction:column;min-width:162px}
.brlbl{font-family:var(--fd);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);padding:6px 10px;border-bottom:1px solid var(--br);text-align:center;background:var(--bg);position:sticky;top:0;z-index:2}
.bgame{background:var(--sf);border:1px solid var(--br);border-radius:7px;overflow:hidden;min-width:154px;margin:3px 0}
.bslot{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--br);transition:background .15s;cursor:pointer}
.bslot:last-of-type{border-bottom:none}
.bslot:hover:not(.bsl):not(.bsua){background:rgba(255,255,255,.05)}
.bslot.bsp{background:rgba(232,200,74,.11)}
.bslot.bsw{background:rgba(61,214,140,.08)}
.bslot.bsd{opacity:.3}.bslot.bsl{cursor:default}
.bslot.bsua{opacity:.18;cursor:not-allowed}
.bseed{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--mu);min-width:16px;text-align:center;flex-shrink:0}
.bslogo{width:20px;height:20px;object-fit:contain;border-radius:50%;background:var(--s2);flex-shrink:0}
.bsname{font-family:var(--fd);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsrec{font-size:9px;color:var(--mu);flex-shrink:0}
.bscheck{font-size:11px;margin-left:auto;flex-shrink:0}
.btbd{color:var(--mu);font-style:italic;font-size:10px}
.bwinbar{display:flex;gap:3px;padding:3px 5px;border-top:1px solid var(--br);background:var(--bg)}
.lbd{background:var(--sf);border:1px solid var(--br);border-radius:10px;overflow:hidden;margin-top:16px}
.lbd-hdr{display:grid;grid-template-columns:28px 1fr 54px 72px 54px 80px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--br);font-family:var(--fd);font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.lbd-row{display:grid;grid-template-columns:28px 1fr 54px 72px 54px 80px;padding:9px 12px;border-bottom:1px solid var(--br);align-items:center}
.lbd-row:last-child{border-bottom:none}
.plbd{background:var(--sf);border:1px solid var(--br);border-radius:10px;overflow:hidden;margin-top:16px}
.plbd-hdr{display:grid;grid-template-columns:28px 1fr 54px 72px 54px 80px 72px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--br);font-family:var(--fd);font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.plbd-row{display:grid;grid-template-columns:28px 1fr 54px 72px 54px 80px 72px;padding:9px 12px;border-bottom:1px solid var(--br);align-items:center}
.plbd-row:last-child{border-bottom:none}
.lbrank{font-family:var(--fd);font-size:16px;font-weight:800;color:var(--mu)}.lbrank.gold{color:var(--ac)}
.lbname{font-weight:600;font-size:13px}
.lbstat{text-align:center;font-family:var(--fd);font-size:13px;font-weight:700}
.lbhi{color:var(--ac)}.lbrec{text-align:center;font-family:var(--fd);font-size:11px;color:var(--mu)}
.pbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pchip{display:flex;align-items:center;gap:5px;padding:5px 9px;background:var(--sf);border:1px solid var(--br);border-radius:18px;font-size:12px}
.pchip.phid{opacity:.35;border-style:dashed}
.av{width:20px;height:20px;border-radius:50%;background:var(--a2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;font-family:var(--fd);flex-shrink:0}
.av.ava{background:var(--ac);color:#000}
.loginwrap{max-width:340px;margin:50px auto;padding:0 16px}
.logincard{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:24px;text-align:center}
.logintitle{font-family:var(--fd);font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.loginsub{color:var(--mu);font-size:12px;margin-bottom:18px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.pbtn{padding:9px;background:var(--bg);border:1px solid var(--br);border-radius:7px;color:var(--tx);cursor:pointer;font-family:var(--fd);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;transition:all .15s;display:flex;align-items:center;gap:7px}
.pbtn:hover,.pbtn.psel{border-color:var(--ac);color:var(--ac);background:rgba(232,200,74,.07)}
.pininput{width:100%;padding:9px;background:var(--bg);border:1px solid var(--br);border-radius:7px;color:var(--tx);font-size:20px;text-align:center;font-family:var(--fd);font-weight:700;letter-spacing:4px;outline:none;margin-bottom:7px}
.pininput:focus{border-color:var(--ac)}
.loginerr{color:var(--dn);font-size:12px;margin-bottom:7px;font-family:var(--fd);font-weight:600}
.movl{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modaltitle{font-family:var(--fd);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px}
.formact{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.flabel{font-size:10px;color:var(--mu);font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.finput{padding:7px 9px;background:var(--bg);border:1px solid var(--br);border-radius:6px;color:var(--tx);font-family:var(--fb);font-size:13px;outline:none;transition:border-color .15s;width:100%}
.finput:focus{border-color:var(--ac)}.finput::placeholder{color:var(--mu)}
.team-entry{background:var(--bg);border:1px solid var(--br);border-radius:8px;padding:10px}
.te-lbl{font-family:var(--fd);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ac);margin-bottom:8px}
.acw{position:relative}
.aclist{position:absolute;top:100%;left:0;right:0;background:var(--sf);border:1px solid var(--ac);border-radius:0 0 7px 7px;max-height:160px;overflow-y:auto;z-index:300;display:none}
.aclist.show{display:block}
.acitem{padding:6px 9px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--br)}
.acitem:hover{background:var(--s2)}.acitem:last-child{border-bottom:none}
.aclogo{width:20px;height:20px;object-fit:contain;border-radius:50%}
.empty{text-align:center;padding:40px 16px;color:var(--mu);font-family:var(--fd);font-size:15px;letter-spacing:.4px}
.empty big{display:block;font-size:32px;margin-bottom:7px}
.divider{height:1px;background:var(--br);margin:18px 0}
.ubadge{display:flex;align-items:center;gap:7px;padding:5px 11px;background:var(--s2);border-radius:18px;font-size:12px;font-weight:600}
.savebanner{background:rgba(61,214,140,.1);border:1px solid var(--ok);border-radius:7px;padding:9px 12px;color:var(--ok);font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.4px;text-align:center;margin-top:9px}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav span{font-family:var(--fd);font-weight:700;font-size:14px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px;margin-bottom:12px}
select.finput option{background:#1a1d27}
.rec-tbl{width:100%;border-collapse:collapse;font-size:12px}
.rec-tbl th{font-family:var(--fd);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);padding:7px 8px;background:var(--bg);border-bottom:1px solid var(--br);white-space:nowrap;text-align:center}
.rec-tbl th:first-child{text-align:left;min-width:110px}
.rec-tbl td{padding:7px 8px;border-bottom:1px solid var(--br);text-align:center;font-family:var(--fd);font-size:12px;font-weight:700}
.rec-tbl td:first-child{text-align:left}
.rec-tbl tr:hover td{background:var(--s2)}.rec-tbl tr:last-child td{border-bottom:none}
.rchamp{display:inline-block;background:var(--ac);color:#000;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:800;font-family:var(--fd)}
.rzero{color:var(--mu);opacity:.35}
.redit{background:transparent;border:1px solid transparent;border-radius:4px;color:var(--tx);font-family:var(--fd);font-size:12px;font-weight:700;text-align:center;width:44px;padding:2px 4px;outline:none;transition:border-color .15s}
.redit:focus{border-color:var(--ac);background:var(--bg)}.redit:hover{border-color:var(--br)}
.season-card{background:var(--sf);border:1px solid var(--br);border-radius:10px;overflow:hidden;margin-bottom:10px}
.season-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--br)}
.season-yr{font-family:var(--fd);font-size:15px;font-weight:800;color:var(--ac)}
.aform{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Family <span>Pick'Em</span></div>
  <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
    <div id="ubw"></div>
    <div class="vtog" id="vtog" style="display:none">
      <button class="vbtn on" onclick="setView('admin')">⚙ Admin</button>
      <button class="vbtn" onclick="setView('family')">🏈 Pick</button>
    </div>
  </div>
</div>
<div class="sporttabs" id="sporttabs" style="display:none"></div>
<div id="app"></div>

})();
</script>

function mkGames(pfx,n){return Array.from({length:n},(_,i)=>({id:`${pfx}_${i}`,slots:[{seed:'',team:'',rec:''},{seed:'',team:'',rec:''}],winner:''}));}
function mkBracket(pfx,...counts){
  const labels=['First Round','Second Round','Quarterfinals','Semifinals','Championship','Final'];
  const rounds=counts.map((n,i)=>{
    let label=labels[i]||`Round ${i+1}`;
    const total=counts.reduce((a,b)=>a+b,0);
    if(i===counts.length-1)label='Championship';
    else if(i===counts.length-2)label='Semifinals';
    else if(i===counts.length-3)label='Quarterfinals';
    else if(i===0)label='First Round';
    else label=`Round ${i+1}`;
    return {label,games:mkGames(`${pfx}_r${i}`,n)};
  });
  return {published:false,locked:false,rounds};
}

function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(SK)||'null');
    if(!d)return defState();
    if(!d.weekLocks)d.weekLocks={};
    if(!d.weekPublished)d.weekPublished={};
    if(d.bowlLocked===undefined)d.bowlLocked=false;
    if(d.bowlPublished===undefined)d.bowlPublished=false;
    if(!d.bowlNames)d.bowlNames=[...BOWL_NAMES_DEFAULT];
    if(!d.hockeyTournaments)d.hockeyTournaments=[];
    if(!d.bracketPicks)d.bracketPicks={};
    if(!d.brackets)d.brackets={};
    if(!d.brackets.cfp)d.brackets.cfp=mkBracket('cfp',4,4,2,1);
    if(!d.brackets.cfpByes)d.brackets.cfpByes=[1,2,3,4].map(s=>({seed:s,team:'',rec:''}));
    if(!d.brackets.fcs)d.brackets.fcs=mkBracket('fcs',8,8,4,2,1);
    if(!d.brackets.fcsByes)d.brackets.fcsByes=[1,2,3,4,5,6,7,8].map(s=>({seed:s,team:'',rec:''}));
    if(!d.brackets.frozenFour)d.brackets.frozenFour=mkBracket('ff',2,1);
    if(!d.brackets.hockeyPlayoff)d.brackets.hockeyPlayoff=mkBracket('hp',8,4,2,1);
    if(!d.brackets.hockeyRegionals)d.brackets.hockeyRegionals={};
    if(!d.brackets.superRegionals)d.brackets.superRegionals=mkBracket('sup',8);
    if(!d.brackets.cws)d.brackets.cws=mkBracket('cws',4);
    if(!d.brackets.cwsSF)d.brackets.cwsSF=mkBracket('cwssf',2);
    if(!d.brackets.cwsFinal)d.brackets.cwsFinal=mkBracket('cwsf',1);
    if(!d.brackets.baseballRegionals)d.brackets.baseballRegionals={};
    if(!d.brackets.baseballRegionNames)d.brackets.baseballRegionNames=[];
    if(!d.brackets.baseballPairings)d.brackets.baseballPairings={supers:[],omaha:[],cwsPairs:[],superResults:[],cwsResults:[]};
    if(!d.brackets.baseballPairings.cwsPairs)d.brackets.baseballPairings.cwsPairs=[];
    if(!d.brackets.baseballPairings.cwsResults)d.brackets.baseballPairings.cwsResults=[];
    if(!d.records)d.records={champs:{},seasons:[]};
    if(d.participants)d.participants.forEach(p=>{if(p.hidden===undefined)p.hidden=false;if(!p.hideSports)p.hideSports=[];});
    // patch published onto all brackets
    const patchB=b=>{if(b&&b.published===undefined)b.published=b.locked||false;};
    ['cfp','fcs','frozenFour','hockeyPlayoff','superRegionals','cws','cwsSF','cwsFinal'].forEach(k=>{if(d.brackets[k])patchB(d.brackets[k]);});
    Object.values(d.brackets.hockeyRegionals||{}).forEach(patchB);
    Object.values(d.brackets.baseballRegionals||{}).forEach(patchB);
    (d.hockeyTournaments||[]).forEach(t=>{if(t.bracket)patchB(t.bracket);});
    return d;
  }catch(e){}
  return defState();
}

function acF(inputId,type){
  const inp=el(inputId),list=el('ac-'+inputId);if(!inp||!list)return;
  const q=inp.value.toLowerCase().trim();
  const tl=type==='baseball'?TEAMS.baseball:type==='hockey'?TEAMS.hockey:TEAMS.football;
  const matches=tl.filter(t=>!q||t.toLowerCase().includes(q)).slice(0,16);
  if(!matches.length){list.classList.remove('show');return;}
  list.innerHTML=matches.map(t=>{const u=lu(t);return `<div class="acitem" onmousedown="acPick('${inputId}','${t.replace(/'/g,"\\'")}')">${u?`<img class="aclogo" src="${u}" onerror="this.style.display='none'">`:'<div style="width:20px"></div>'}<span>${esc(t)}</span></div>`;}).join('');
  list.classList.add('show');
}
function acH(inputId){const l=el('ac-'+inputId);if(l)l.classList.remove('show');}
function acPick(inputId,team){
  const i=el(inputId);if(!i)return;
  i.value=team;
  acH(inputId);
  // Dispatch change event so onchange handlers (including setBSlot) fire
  i.dispatchEvent(new Event('change',{bubbles:true}));
}

// ═══ GAME CARD ═══
function rGameCard(g,gi,myPick,admin,locked,sport,wk,extraOpts){
  const aw=g.away||{},hm=g.home||{};
  const isTie=g.tie===true;
  const awW=g.winner===aw.name&&!isTie,hmW=g.winner===hm.name&&!isTie;
  const awT=isTie,hmT=isTie;
  function tside(t,isPicked,isWon,isTied,isLost,clickFn){
    const u=lu(t.name);
    const logo=u?`<img src="${u}" crossorigin="anonymous" style="width:34px;height:34px;object-fit:contain" onerror="this.style.display='none';this.nextSibling.style.display='flex'" alt=""><div class="tfall" style="display:none">${ab(t.name)}</div>`:`<div class="tfall">${ab(t.name)}</div>`;
    let cls=`tside${isPicked&&!isWon&&!isTied?' tpk':''}${isWon?' twn':''}${isTied?' ttie':''}${isLost?' tls':''}${(admin||locked)?' tlk':''}`;
    let badge=isPicked&&!isWon&&!isTied?`<div class="pbadge pbmy">My pick</div>`:isWon?`<div class="pbadge pbwin">Winner ✓</div>`:isTied?`<div class="pbadge pbtie">Tie</div>`:'';
    const seedStr=t.seed?`<div class="tseed">${esc(t.seed)}</div>`:(t.natSeed?`<div class="tseed">#${esc(t.natSeed)}${t.regSeed?' ('+esc(t.regSeed)+')':''}</div>`:'');
    return `<div class="${cls}" ${!admin&&!locked&&clickFn?`onclick="${clickFn}"`:''}><div class="tlogo">${logo}</div>${seedStr}<div class="tname">${esc(t.name||'TBD')}</div>${t.rec?`<div class="trec">${esc(t.rec)}</div>`:''} ${badge}</div>`;
  }
  const key=`${sport}-w${wk}-g${gi}`;
  const meta=[];
  if(g.datetime)meta.push(`<span class="gmi">📅 <b>${esc(g.datetime)}</b></span>`);
  if(g.location)meta.push(`<span class="gmi">📍 ${esc(g.location)}</span>`);
  if(g.label)meta.push(`<span class="gmi">🏆 ${esc(g.label)}</span>`);
  if(g.spread)meta.push(`<span class="gspd">${esc(g.spread)}</span>`);
  if(g.network)meta.push(`<span class="gnet">${esc(g.network)}</span>`);
  const metaBar=meta.length?`<div class="gmeta">${meta.join('')}</div>`:'';
  let tally='';
  if(admin){
    const ta={[aw.name]:0,[hm.name]:0,tie:0};
    activePlayers().forEach(p=>{const pk=(S.picks[p.id]||{})[key];if(pk==='TIE')ta.tie++;else if(pk&&ta[pk]!==undefined)ta[pk]++;});
    tally=`<div class="tally">${esc(aw.name)}: <b>${ta[aw.name]||0}</b> | ${esc(hm.name)}: <b>${ta[hm.name]||0}</b>${ta.tie?` | Tie: <b>${ta.tie}</b>`:''}</div>`;
  }
  const canPick=!admin&&!locked&&!g.winner&&!g.tie;
  const isHockeyReg=sport==='hockey';
  const foot=admin?`<div class="gfoot">${tally}<div style="display:flex;gap:5px;flex-wrap:wrap">
    ${aw.name?`<button class="btn bg_ btn-sm" style="${awW?'border-color:var(--ok);color:var(--ok)':''}" onclick="markWin('${sport}',${wk},${gi},'${aw.name.replace(/'/g,"\\'")}')">${awW?'✓ Won':'✓ '+ab(aw.name)}</button>`:''}
    ${hm.name?`<button class="btn bg_ btn-sm" style="${hmW?'border-color:var(--ok);color:var(--ok)':''}" onclick="markWin('${sport}',${wk},${gi},'${hm.name.replace(/'/g,"\\'")}')">${hmW?'✓ Won':'✓ '+ab(hm.name)}</button>`:''}
    ${isHockeyReg?`<button class="btn bg_ btn-sm" style="${isTie?'border-color:var(--a2);color:var(--a2)':''}" onclick="markTie('${sport}',${wk},${gi})">${isTie?'Tied':'Tie'}</button>`:''}
    ${(awW||hmW||isTie)?`<button class="btn bg_ btn-sm" onclick="clearWin('${sport}',${wk},${gi})">↩ Clear</button>`:''}
    <button class="btn bg_ btn-sm" onclick="openEditGame('${sport}',${wk},${gi})">✏</button>
    <button class="btn bd btn-sm" onclick="delGame('${sport}',${wk},${gi})">✕</button>
  </div></div>`:'';
  const awPk=myPick===aw.name,hmPk=myPick===hm.name,tPk=myPick==='TIE';
  return `<div class="gcard">${metaBar}<div class="gteams">
    ${tside(aw,awPk,awW,awT&&!awPk,hmW&&!awW,canPick?`slPick('${sport}',${wk},${gi},'${aw.name.replace(/'/g,"\\'")}')`:'')}
    <div class="vscol"><div class="vst">VS</div></div>
    ${tside(hm,hmPk,hmW,hmT&&!hmPk,awW&&!hmW,canPick?`slPick('${sport}',${wk},${gi},'${hm.name.replace(/'/g,"\\'")}')`:'')}
  </div>${isHockeyReg&&canPick?`<div style="padding:4px 8px;border-top:1px solid var(--br);background:var(--bg);text-align:center"><button class="btn bg_ btn-sm" onclick="slPick('${sport}',${wk},${gi},'TIE')" style="${tPk?'border-color:var(--a2);color:var(--a2)':''}">Tie${tPk?' ✓':''}</button></div>`:''}
  ${foot}</div>`;
}
function slPick(sport,wk,gi,team){
  const key=`${sport}-w${wk}-g${gi}`;
  if(!S.picks[SES.pid])S.picks[SES.pid]={};
  S.picks[SES.pid][key]=team;UI.saved=false;render();
}
function markWin(sport,wk,gi,team){
  const g=(gg(sport,wk)||[])[gi];if(!g)return;
  g.winner=team;g.tie=false;render();
}
function markTie(sport,wk,gi){
  const g=(gg(sport,wk)||[])[gi];if(!g)return;
  g.tie=true;g.winner=null;render();
}
function clearWin(sport,wk,gi){
  const g=(gg(sport,wk)||[])[gi];if(!g)return;
  g.winner=null;g.tie=false;render();
}
function delGame(sport,wk,gi){
  if(!confirm('Delete this game?'))return;
  const games=gg(sport,wk);games.splice(gi,1);sg(sport,wk,games);render();
}
function openEditGame(sport,wk,gi){
  UI.editGame={...gg(sport,wk)[gi]};UI.editGameSport=sport;UI.editGameWk=wk;UI.editGameIdx=gi;UI.adding=false;render();
}
function saveEditGame(sport){
  const g=readGameForm(sport);
  g.winner=UI.editGame.winner;g.tie=UI.editGame.tie;
  const games=gg(UI.editGameSport,UI.editGameWk);games[UI.editGameIdx]=g;
  sg(UI.editGameSport,UI.editGameWk,games);UI.editGame=null;render();
}
// ═══ LEADERBOARD ═══
function rLB(sportFilter){
  // Collect all active players
  const players=activePlayers();
  // Determine current week games for weekly stats
  const isSlate=S.sport==='cfb'||S.sport==='hockey';
  const curSport=S.sport==='hockey'?'hockey':'cfb';
  const curWk=S.sport==='hockey'?UI.hweek:S.week;
  const curGames=gg(curSport,curWk);

  const rows=players.map(p=>{
    // Weekly (current week, current sport)
    let wPts=0,wW=0,wL=0;
    curGames.forEach((g,gi)=>{
      const key=`${curSport}-w${curWk}-g${gi}`;
      const pick=(S.picks[p.id]||{})[key];
      if(!pick)return;
      const correct=g.tie?(pick==='TIE'):(pick===g.winner);
      const decided=g.winner||g.tie;
      if(decided){if(correct){wPts++;wW++;}else wL++;}
    });
    // Total = only current sport's games this season
    let tPts=0,tW=0,tL=0;
    const isBowlTab=(S.sport==='post'&&UI.posttab==='bowls');
    const isHockeyTab=(S.sport==='hockey');
    const isCFBTab=(S.sport==='cfb');
    if(isCFBTab||isHockeyTab){
      // Sum all weeks for this sport
      const sp=isHockeyTab?'hockey':'cfb';
      Object.entries(S.games[sp]||{}).forEach(([wk,games])=>{
        (games||[]).forEach((g,gi)=>{
          const key=`${sp}-w${wk}-g${gi}`;
          const pick=(S.picks[p.id]||{})[key];if(!pick)return;
          const correct=g.tie?(pick==='TIE'):(pick===g.winner);
          const decided=g.winner||g.tie;
          if(decided){if(correct){tPts++;tW++;}else tL++;}
        });
      });
    } else if(isBowlTab){
      // Bowl season only
      Object.entries(S.bowlPicks[p.id]||{}).forEach(([bi,pick])=>{
        const res=S.bowlResults[bi];if(!res)return;
        if(pick===res){tPts++;tW++;}else tL++;
      });
    } else {
      // Other tabs (CFP, FCS): don't bleed into regular season
      tPts=wPts;tW=wW;tL=wL;
    }
    return {p,wPts,wW,wL,tPts,tW,tL};
  }).sort((a,b)=>b.tPts-a.tPts||b.wPts-a.wPts);

  let h=`<div class="sh"><div class="st">Leaderboard</div></div>
  <div class="lbd">
    <div class="lbd-hdr"><div>#</div><div>Player</div><div style="text-align:center">Wk Pts</div><div style="text-align:center">Wk Record</div><div style="text-align:center">Total Pts</div><div style="text-align:center">Total Record</div></div>`;
  rows.forEach((r,i)=>{
    h+=`<div class="lbd-row">
      <div class="lbrank ${i===0?'gold':''}">${i+1}</div>
      <div class="lbname">${esc(r.p.name)}</div>
      <div class="lbstat lbhi">${r.wPts}</div>
      <div class="lbrec">${r.wW}-${r.wL}</div>
      <div class="lbstat">${r.tPts}</div>
      <div class="lbrec">${r.tW}-${r.tL}</div>
    </div>`;
  });
  return h+`</div>`;
}

// Playoff LB with pts remaining
function rPlayoffLB(bracketKey,bracket,ptsByRound,maxPts){
  const players=activePlayers();
  const rows=players.map(p=>{
    const myPicks=(S.bracketPicks[bracketKey]||{})[p.id]||{};
    let pts=0,w=0,l=0,remaining=0;
    bracket.rounds.forEach((round,ri)=>{
      const rPts=ptsByRound[ri]||1;
      round.games.forEach(g=>{
        const pick=myPicks[g.id];if(!pick)return;
        if(g.winner){if(pick===g.winner){pts+=rPts;w++;}else l++;}
        else{
          // still alive? check if picked team was eliminated in prior round
          const elim=isEliminated(pick,bracketKey,bracket,ri,myPicks);
          if(!elim)remaining+=rPts;
        }
      });
    });
    return {p,pts,w,l,remaining};
  }).sort((a,b)=>b.pts+b.remaining-(a.pts+a.remaining)||b.pts-a.pts);

  let h=`<div class="sh"><div class="st">Playoff Leaderboard <small>max ${maxPts} pts</small></div></div>
  <div class="plbd">
    <div class="plbd-hdr"><div>#</div><div>Player</div><div style="text-align:center">Pts</div><div style="text-align:center">Record</div><div style="text-align:center">Total Pts</div><div style="text-align:center">Total Record</div><div style="text-align:center">Pts Left</div></div>`;
  rows.forEach((r,i)=>{
    // total pts across everything
    let tPts=0,tW=0,tL=0;
    Object.entries(S.picks[r.p.id]||{}).forEach(([key,pick])=>{
      const parts=key.split('-');const sp=parts[0]==='hockey'?'hockey':'cfb';
      const wk=parts[1]?.replace('w','');const gi=parseInt(parts[2]?.replace('g',''));
      const g=((S.games[sp]||{})[wk]||[])[gi];
      if(g){const correct=g.tie?(pick==='TIE'):(pick===g.winner);const decided=g.winner||g.tie;if(decided){if(correct){tPts++;tW++;}else tL++;}}
    });
    Object.entries(S.bowlPicks[r.p.id]||{}).forEach(([bi,pick])=>{const res=S.bowlResults[bi];if(!res)return;if(pick===res){tPts++;tW++;}else tL++;});
    tPts+=r.pts;tW+=r.w;tL+=r.l;
    h+=`<div class="plbd-row">
      <div class="lbrank ${i===0?'gold':''}">${i+1}</div>
      <div class="lbname">${esc(r.p.name)}</div>
      <div class="lbstat lbhi">${r.pts}</div>
      <div class="lbrec">${r.w}-${r.l}</div>
      <div class="lbstat">${tPts}</div>
      <div class="lbrec">${tW}-${tL}</div>
      <div class="lbstat" style="color:var(--wn)">${r.remaining}</div>
    </div>`;
  });
  return h+`</div>`;
}

function isEliminated(team,bkey,bracket,targetRound,myPicks){
  // Check if team lost in any round <= targetRound
  for(let ri=0;ri<targetRound;ri++){
    const round=bracket.rounds[ri];if(!round)continue;
    for(const g of round.games){
      if((g.slots[0].team===team||g.slots[1].team===team)){
        if(g.winner&&g.winner!==team)return true;
      }
    }
  }
  return false;
}

function setBSlot(bkey,ri,gi,si,field,val){
  const b=getBracket(bkey);if(!b)return;
  const round=b.rounds[ri];if(!round)return;
  const game=round.games[gi];if(!game)return;
  const oldTeam=game.slots[si].team;
  game.slots[si][field]=val.trim();
  // If team changed, cascade-clear that team from all later rounds
  if(field==='team'&&oldTeam&&oldTeam!==val.trim()){
    cascadeClearTeam(b,oldTeam,ri,gi);
    // Also clear bracketPicks for this bracket key
    if(S.bracketPicks[bkey]){
      Object.values(S.bracketPicks[bkey]).forEach(playerPicks=>{
        Object.keys(playerPicks).forEach(gid=>{if(playerPicks[gid]===oldTeam)delete playerPicks[gid];});
      });
    }
  }
  sv();
}
function cascadeClearTeam(bracket,team,fromRound,fromGame){
  // Remove team from all games in rounds after fromRound
  // and clear any winners that were that team
  bracket.rounds.forEach((round,ri)=>{
    if(ri<fromRound)return;
    round.games.forEach((g,gi)=>{
      if(ri===fromRound&&gi<=fromGame)return;
      // Clear slots containing this team
      g.slots.forEach(s=>{if(s.team===team){s.team='';s.seed='';s.rec='';}});
      // Clear winner if it was this team
      if(g.winner===team)g.winner='';
    });
  });
}

function setBW(bkey,gid,team){
  const b=getBracket(bkey);if(!b)return;
  let ri=-1,gi=-1;
  b.rounds.forEach((r,rIdx)=>r.games.forEach((g,gIdx)=>{if(g.id===gid){ri=rIdx;gi=gIdx;g.winner=team;}}));
  // Cascade: find the losing team and remove from later rounds
  if(ri>=0&&gi>=0){
    const game=b.rounds[ri].games[gi];
    const loser=game.slots.find(s=>s.team&&s.team!==team);
    if(loser&&loser.team)cascadeClearTeam(b,loser.team,ri,gi);
    // Cascade-clear picks for loser
    if(S.bracketPicks[bkey]){
      Object.values(S.bracketPicks[bkey]).forEach(pp=>{
        Object.keys(pp).forEach(gid2=>{if(pp[gid2]===loser?.team)delete pp[gid2];});
      });
    }
  }
  sv();render();
}
function clearBW(bkey,gid){const b=getBracket(bkey);if(!b)return;b.rounds.forEach(r=>r.games.forEach(g=>{if(g.id===gid)g.winner=null;}));sv();render();}

// ═══ BRACKET VISUAL ═══
function rBracketVisual(bkey,bracket,famMode,myPicks,cfpByes,fcsByes){
  const rounds=bracket.rounds||[];if(!rounds.length)return '';
  const SLOTW=164,SLOTH=54,PAD=6,CONN=28;
  const maxGames=rounds[0].games.length;
  const totalH=maxGames*(SLOTH*2+10)+PAD*2+30;
  const totalW=rounds.length*(SLOTW+CONN)+CONN;

  // CFP: R0 has 4 games (seeds 5-12). QF (R1) has 4 games each with [bye, R0-winner].
  // FCS: R0 has 8 games (seeds 17-24 vs 9-16). R1 has 8 games each with [bye, R0-winner].
  const isCFP=bkey==='cfp', isFCS=bkey==='fcs';
  const byeSlots=isCFP?cfpByes:(isFCS?fcsByes:null); // array of {team,seed,rec}

  function buildVisTeams(){
    const vis=rounds.map(r=>r.games.map(()=>['','']));
    // R0: actual slot teams
    rounds[0].games.forEach((g,gi)=>{
      vis[0][gi][0]=g.slots[0]?.team||'';
      vis[0][gi][1]=g.slots[1]?.team||'';
    });
    // Inject byes into R1: each R1 game slot 0 = bye[gi], slot 1 = pick from R0 game gi
    if((isCFP||isFCS)&&byeSlots&&rounds[1]){
      rounds[1].games.forEach((g,gi)=>{
        vis[1][gi][0]=byeSlots[gi]?.team||'';
        // slot 1 will be filled by R0 cascade below
      });
    }
    // Cascade picks forward
    for(let ri=0;ri<rounds.length-1;ri++){
      rounds[ri].games.forEach((g,gi)=>{
        const pick=myPicks[g.id];if(!pick)return;
        // For CFP/FCS: R0 winner goes into R1 game gi, slot 1 (not floor(gi/2))
        if((isCFP||isFCS)&&ri===0){
          if(rounds[1]&&rounds[1].games[gi]){
            vis[1][gi][1]=pick;
          }
        } else {
          const nextGi=Math.floor(gi/2);
          const nextSi=gi%2;
          if(rounds[ri+1]&&rounds[ri+1].games[nextGi]){
            vis[ri+1][nextGi][nextSi]=pick;
          }
        }
      });
    }
    return vis;
  }

  let svgLines='';let gameDivs='';
  const visTeams=famMode?buildVisTeams():null;

  rounds.forEach((round,ri)=>{
    const n=round.games.length;
    const spacing=totalH/n;
    const x=ri*(SLOTW+CONN)+PAD;
    round.games.forEach((game,gi)=>{
      const cy=(spacing*(gi+0.5))+20;
      const gameTop=Math.round(cy-(SLOTH));
      if(ri<rounds.length-1){
        const nx=x+SLOTW+CONN;
        const nextN=rounds[ri+1].games.length;
        const nextSpacing=totalH/nextN;
        // For CFP/FCS: R0→R1 is 1-to-1 (each R0 feeds exactly one R1 game)
        const nextGi=(isCFP||isFCS)&&ri===0 ? gi : Math.floor(gi/2);
        const nextCy=(nextSpacing*(nextGi+0.5))+20;
        const col='rgba(255,255,255,0.1)';
        svgLines+=`<line x1="${x+SLOTW}" y1="${cy}" x2="${x+SLOTW+CONN/2}" y2="${cy}" stroke="${col}" stroke-width="1"/>`;
        // For CFP/FCS R0→R1: straight line, no pair bracket
        if(!((isCFP||isFCS)&&ri===0)){
          if(gi%2===0){
            const pairCy1=(spacing*(gi+1+0.5))+20;
            svgLines+=`<line x1="${x+SLOTW+CONN/2}" y1="${cy}" x2="${x+SLOTW+CONN/2}" y2="${pairCy1}" stroke="${col}" stroke-width="1"/>`;
          }
        }
        svgLines+=`<line x1="${x+SLOTW+CONN/2}" y1="${nextCy}" x2="${nx}" y2="${nextCy}" stroke="${col}" stroke-width="1"/>`;
      }
      // Show location for R0 games if available
      const gameLoc=(!famMode&&ri===0&&game.location)?game.location:'';
      let gdiv=`<div style="position:absolute;left:${x}px;top:${gameTop}px;width:${SLOTW}px" class="bgame">`+
        (gameLoc?`<div style="font-size:9px;color:var(--mu);padding:3px 7px;border-bottom:1px solid var(--br);background:var(--bg);text-align:center">📍 ${esc(gameLoc)}</div>`:'');
      [0,1].forEach(si=>{
        let team,seed,rec;
        if(famMode&&visTeams){
          team=visTeams[ri]?.[gi]?.[si]||'';
          seed=ri===0?(game.slots[si]?.seed||''):'';
          // For R1 in CFP/FCS, show bye seed for slot 0
          if((isCFP||isFCS)&&ri===1&&si===0&&byeSlots)seed=byeSlots[gi]?.seed||'';
          rec='';
        } else {
          const slot=game.slots[si]||{};
          team=slot.team||'';
          // For admin view: CFP/FCS R1 slot 0 comes from byes
          if((isCFP||isFCS)&&ri===1&&si===0&&!team&&byeSlots)team=byeSlots[gi]?.team||'';
          seed=slot.seed||((isCFP||isFCS)&&ri===1&&si===0&&byeSlots?byeSlots[gi]?.seed||'':'');
          rec=slot.rec||'';
        }
        const myPick=famMode?myPicks[game.id]:null;
        const isPicked=myPick===team&&!!team;
        const isWon=game.winner===team&&!!team;
        const isLost=!!game.winner&&game.winner!==team&&!!team;
        const te=team.split("'").join("\\'");
        const canPickSlot=famMode&&(bracket.published||bracket.locked)&&!bracket.locked&&!!team&&!game.winner;
        const click=canPickSlot?`onclick="bfPick('${bkey}','${game.id}','${te}')"`: '';
        const logoU=team?lu(team):null;
        const abbr=team?ab(team):'';
        const logoEl=team?(logoU
          ?`<img class="bslogo" src="${logoU}" crossorigin="anonymous" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><div class="bslogo" style="display:none;align-items:center;justify-content:center;font-family:var(--fd);font-size:7px;font-weight:800;color:var(--mu)">${abbr}</div>`
          :`<div class="bslogo" style="display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:7px;font-weight:800;color:var(--mu)">${abbr}</div>`)
          :`<div class="bslogo"></div>`;
        const check=isPicked?`<span class="bscheck" style="color:${isWon?'var(--ok)':'var(--ac)'}">&#10003;</span>`:'';
        const seedStr=seed?`<span class="bseed">${esc(seed)}</span>`:'<span class="bseed" style="opacity:.1">#</span>';
        const nameStr=team?`<span class="bsname">${esc(team)}</span>${rec?`<span class="bsrec">${esc(rec)}</span>`:''}`:
          (famMode&&ri>0?`<span class="btbd" style="font-size:9px">Pick R${ri}</span>`:`<span class="btbd">TBD</span>`);
        let cls=`bslot${isPicked?' bsp':''}${isWon?' bsw':''}${isLost?' bsd':''}${!team?' bsl':''}`;
        gdiv+=`<div class="${cls}" ${click}>${seedStr}${logoEl}${nameStr}${check}</div>`;
      });
      if(!famMode){
        // Show actual slot teams or byes for admin win buttons
        let t0=game.slots[0]?.team||'',t1=game.slots[1]?.team||'';
        if((isCFP||isFCS)&&ri===1&&byeSlots){t0=byeSlots[gi]?.team||t0;}
        if(t0||t1){
          const t0s=t0.split("'").join("\\'"),t1s=t1.split("'").join("\\'");
          gdiv+=`<div class="bwinbar">
            ${t0?`<button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${game.winner===t0?'border-color:var(--ok);color:var(--ok)':''}" onclick="setBW('${bkey}','${game.id}','${t0s}')">${ab(t0)}</button>`:''}
            ${t1?`<button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${game.winner===t1?'border-color:var(--ok);color:var(--ok)':''}" onclick="setBW('${bkey}','${game.id}','${t1s}')">${ab(t1)}</button>`:''}
            ${game.winner?`<button class="btn bg_ btn-sm" style="font-size:9px" onclick="clearBW('${bkey}','${game.id}')">&#8617;</button>`:''}
          </div>`;
        }
      }
      gdiv+=`</div>`;
      gameDivs+=gdiv;
      if(gi===0){gameDivs+=`<div style="position:absolute;left:${x}px;top:2px;width:${SLOTW}px;font-family:var(--fd);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);text-align:center;background:var(--bg);padding:3px 0;border-radius:4px 4px 0 0">${esc(round.label)}</div>`;}
    });
  });
  return `<div class="bwrap"><div style="position:relative;width:${totalW}px;height:${totalH}px">
    <svg style="position:absolute;top:0;left:0;pointer-events:none" width="${totalW}" height="${totalH}">${svgLines}</svg>
    ${gameDivs}
  </div></div>`;
}

function createHockeyTourn(){
  const name=prompt('Tournament name (e.g. Ice Breaker, GLI):');if(!name?.trim())return;
  const gs=prompt('Number of first-round games?\n(e.g. 2 for 4-team, 4 for 8-team):');
  const games=parseInt(gs);if(!games||games<1||games>16){alert('Enter 1-16');return;}
  const key='ht_'+Date.now();
  const roundCounts=[];let n=games;
  while(n>=1){roundCounts.push(n);if(n===1)break;n=Math.ceil(n/2);}
  const labels=['First Round','Quarterfinals','Semifinals','Championship'];
  const rounds=roundCounts.map((cnt,ri)=>({label:labels[Math.min(ri,labels.length-1)],games:mkGames(key+'_r'+ri,cnt)}));
  S.hockeyTournaments.push({key,name:name.trim(),location:'',bracket:{locked:false,rounds}});
  UI.htournTab=key;sv();render();
}

        <span style="font-family:var(--fd);font-size:10px;font-weight:700;color:var(--ac);min-width:14px">${ti+1}</span>
        <div class="acw" style="flex:1"><input class="finput" id="brt-${rname}-${ti}" value="${esc(t.name)}" placeholder="Team…" autocomplete="off" style="font-size:11px;padding:5px 7px"
          oninput="brAC('${re}',${ti})" onfocus="brAC('${re}',${ti})" onblur="setTimeout(()=>brACH('${re}',${ti}),150)" onchange="setBaseballTeam('${re}',${ti},'name',this.value)">
          <div class="aclist" id="ac-brt-${rname}-${ti}"></div></div>
      </div>`;

          ${ta.name?`<button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${w===ta.name?'border-color:var(--ok);color:var(--ok)':''}" onclick="setBRResult('${re}',${ri},'${ta.name.replace(/'/g,"\\'")}')">${esc(ta.name)}</button>`:''}
          ${tb.name?`<button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${w===tb.name?'border-color:var(--ok);color:var(--ok)':''}" onclick="setBRResult('${re}',${ri},'${tb.name.replace(/'/g,"\\'")}')">${esc(tb.name)}</button>`:''}
          ${w?`<button class="btn bg_ btn-sm" style="font-size:9px" onclick="setBRResult('${re}',${ri},'')">↩</button>`:''}
        </div>`;
      });
      const w1=res[0]||'',w2=res[1]||'',wf=res[2]||'';
      if(w1&&w2)h+=`<div style="display:flex;gap:3px;align-items:center">
        <span style="font-size:9px;color:var(--ac);font-family:var(--fd);font-weight:700;min-width:18px">Fnl</span>
        <button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${wf===w1?'border-color:var(--ok);color:var(--ok)':''}" onclick="setBRResult('${re}',2,'${w1.replace(/'/g,"\\'")}')">${esc(w1)}</button>
        <button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${wf===w2?'border-color:var(--ok);color:var(--ok)':''}" onclick="setBRResult('${re}',2,'${w2.replace(/'/g,"\\'")}')">${esc(w2)}</button>
        ${wf?`<button class="btn bg_ btn-sm" style="font-size:9px" onclick="setBRResult('${re}',2,'')">↩</button>`:''}
      </div>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  return h+`</div>`;
}

// ── Main bracket renderer (admin+fam) ──
function rBaseballBracketFull(famMode){
  const bp=S.brackets.baseballPairings;
  if(!bp.supers)bp.supers=[];
  if(!bp.cws)bp.cws=[];
  if(!bp.superResults)bp.superResults=[];
  if(!bp.cwsResults)bp.cwsResults=[];
  const pairs=bp.supers;
  const cwsPairs=bp.cws;
  const regions=S.brackets.baseballRegionNames;
  let h='';

  if(!famMode){
    // ── Admin: Super Regional Site pairing (hockey-style boxes) ──
    h+=`<div style="font-family:var(--fd);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Super Regional Pairings</div>`;
    const numSRs=Math.min(8,Math.max(Math.ceil(regions.length/2),1));
    for(let siteIdx=0;siteIdx<4;siteIdx++){
      const sr1=siteIdx*2,sr2=siteIdx*2+1;
      if(sr1>=numSRs)continue;
      const siteName=bp.srSiteNames?.[siteIdx]||'';
      const siteLoc=bp.srSiteLocs?.[siteIdx]||'';
      h+=`<div style="border:2px solid var(--br);border-radius:10px;padding:11px;margin-bottom:12px;background:var(--sf)">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
          <div style="font-family:var(--fd);font-size:12px;font-weight:800;color:var(--ac)">Super Regional Site ${siteIdx+1}</div>
          <input class="finput" value="${esc(siteName)}" placeholder="Site name" style="flex:1;min-width:120px;font-size:11px;padding:5px 8px" onchange="setBBSRSite(${siteIdx},'name',this.value)">
          <input class="finput" value="${esc(siteLoc)}" placeholder="Location" style="flex:1;min-width:140px;font-size:11px;padding:5px 8px" onchange="setBBSRSite(${siteIdx},'loc',this.value)">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
      for(let piOff=0;piOff<2;piOff++){
        const pi=siteIdx*2+piOff;if(pi>=numSRs)continue;
        const pair=pairs[pi]||['',''];
        const w1=pair[0]?getBaseballReg(pair[0]).results?.[2]||'':'';
        const w2=pair[1]?getBaseballReg(pair[1]).results?.[2]||'':'';
        const srRes=(bp.superResults||[])[pi]||'';
        h+=`<div style="background:var(--bg);border:1px solid ${pair[0]&&pair[1]?'var(--ac)':'var(--br)'};border-radius:7px;padding:8px">
          <div style="font-family:var(--fd);font-size:10px;font-weight:700;color:var(--ac);margin-bottom:6px">SR ${pi+1}</div>
          <div class="fg" style="margin-bottom:4px"><label class="flabel">Regional 1</label>
            <select class="finput" style="font-size:11px;padding:4px 6px" onchange="setBBPair(${pi},0,this.value)">
              <option value="">— none —</option>
              ${regions.map(r=>`<option value="${esc(r)}" ${pair[0]===r?'selected':''}>${esc(r.replace(' Regional',''))}</option>`).join('')}
            </select></div>
          <div class="fg" style="margin-bottom:${w1&&w2?'5px':'0'}"><label class="flabel">Regional 2</label>
            <select class="finput" style="font-size:11px;padding:4px 6px" onchange="setBBPair(${pi},1,this.value)">
              <option value="">— none —</option>
              ${regions.map(r=>`<option value="${esc(r)}" ${pair[1]===r?'selected':''}>${esc(r.replace(' Regional',''))}</option>`).join('')}
            </select></div>
          ${w1&&w2?`<div style="border-top:1px solid var(--br);padding-top:5px"><div style="display:flex;gap:3px">
            <button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${srRes===w1?'border-color:var(--ok);color:var(--ok)':''}" onclick="setSupResult(${pi},'${w1.replace(/'/g,"\\'")}')">${esc(w1)}</button>
            <button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${srRes===w2?'border-color:var(--ok);color:var(--ok)':''}" onclick="setSupResult(${pi},'${w2.replace(/'/g,"\\'")}')">${esc(w2)}</button>
            ${srRes?`<button class="btn bg_ btn-sm" style="font-size:9px" onclick="setSupResult(${pi},'')">↩</button>`:''}
          </div></div>`:''}
        </div>`;
      }
      h+=`</div></div>`;
    }

    // ── Admin: CWS Bracket Pairings (which 2 SR sites go together) ──
    h+=`<div style="font-family:var(--fd);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">CWS Bracket Pairings</div>`;
    h+=`<div style="font-size:11px;color:var(--mu);margin-bottom:10px">Which 2 Super Regional Sites meet in each CWS bracket?</div>`;
    const numSRsAll=Math.min(8,Math.max(pairs.length,Math.ceil(regions.length/2)));
    const srLabels=[];
    for(let si=0;si<numSRsAll;si++){
      const p=pairs[si]||['',''];
      srLabels.push(`SR ${si+1}${p[0]?' ('+p[0].replace(' Regional','')+'/'+(p[1]?p[1].replace(' Regional',''):'?')+')':''}`);
    }
    h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:7px;margin-bottom:18px">`;
    for(let ci=0;ci<4;ci++){
      const cp=cwsPairs[ci]||['',''];
      const srAi=cp[0]!==''?parseInt(cp[0]):-1;
      const srBi=cp[1]!==''?parseInt(cp[1]):-1;
      const wA=(bp.superResults||[])[srAi>=0?srAi:0]||'';
      const wB=(bp.superResults||[])[srBi>=0?srBi:0]||'';
      const cwsRes=(bp.cwsResults||[])[ci]||'';
      h+=`<div style="background:var(--sf);border:2px solid ${cp[0]!==''&&cp[1]!==''?'var(--wn)':'var(--br)'};border-radius:8px;padding:9px">
        <div style="font-family:var(--fd);font-size:10px;font-weight:800;color:var(--wn);margin-bottom:7px">CWS GAME ${ci+1}</div>
        <div class="fg" style="margin-bottom:4px"><label class="flabel">Super Regional A</label>
          <select class="finput" style="font-size:11px;padding:4px 6px" onchange="setCWSPair(${ci},0,this.value)">
            <option value="">— none —</option>
            ${srLabels.map((lbl,si)=>`<option value="${si}" ${cp[0]===String(si)?'selected':''}>${esc(lbl)}</option>`).join('')}
          </select></div>
        <div class="fg" style="margin-bottom:${wA&&wB?'5px':'0'}"><label class="flabel">Super Regional B</label>
          <select class="finput" style="font-size:11px;padding:4px 6px" onchange="setCWSPair(${ci},1,this.value)">
            <option value="">— none —</option>
            ${srLabels.map((lbl,si)=>`<option value="${si}" ${cp[1]===String(si)?'selected':''}>${esc(lbl)}</option>`).join('')}
          </select></div>
        ${wA&&wB?`<div style="border-top:1px solid var(--br);padding-top:5px"><div style="display:flex;gap:3px">
          <button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${cwsRes===wA?'border-color:var(--ok);color:var(--ok)':''}" onclick="setCWSResult(${ci},'${wA.replace(/'/g,"\\'")}')">${esc(wA)}</button>
          <button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${cwsRes===wB?'border-color:var(--ok);color:var(--ok)':''}" onclick="setCWSResult(${ci},'${wB.replace(/'/g,"\\'")}')">${esc(wB)}</button>
          ${cwsRes?`<button class="btn bg_ btn-sm" style="font-size:9px" onclick="setCWSResult(${ci},'')">↩</button>`:''}
        </div></div>`:''}
      </div>`;
    }
    h+=`</div><div class="divider"></div>`;
  }

  // ── VISUAL BRACKET ──
  return h+rBaseballVisual(famMode);
}

function rBaseballVisual(famMode){
  const bp=S.brackets.baseballPairings;
  const pairs=bp?.supers||[];
  const cwsPairs=bp?.cws||[];
  const regions=S.brackets.baseballRegionNames;
  const superResults=bp?.superResults||[];
  const cwsResults=bp?.cwsResults||[];

  function teamChip(name,isChamp,isPicked,canPick,clickFn,size){
    if(!name)return `<div style="height:${size||28}px;border:1px dashed var(--br);border-radius:5px;flex:1;opacity:.4"></div>`;
    const u=lu(name,'baseball');
    const border=isChamp?'2px solid var(--a2)':isPicked?'2px solid var(--ac)':'1px solid var(--br)';
    const bg=isChamp?'rgba(74,144,232,.15)':isPicked?'rgba(232,200,74,.12)':'var(--bg)';
    const click=canPick&&clickFn?`onclick="${clickFn}"`:'';
    const sz=size||28;
    return `<div style="display:flex;align-items:center;gap:4px;padding:3px 6px;border:${border};border-radius:5px;background:${bg};cursor:${canPick?'pointer':'default'};flex:1" ${click}>
      ${u?`<img src="${u}" style="width:${sz}px;height:${sz}px;object-fit:contain;flex-shrink:0" onerror="this.style.display='none'" alt="">`:
          `<div style="width:${sz}px;height:${sz}px;background:var(--s2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:8px;font-weight:800;color:var(--mu);flex-shrink:0">${ab(name)}</div>`}
      <span style="font-family:var(--fd);font-size:9px;font-weight:700;line-height:1.2;word-break:break-word">${esc(name)}</span>
      ${isChamp?'<span style="font-size:8px;color:var(--a2);margin-left:auto">🏆</span>':''}
    </div>`;
  }

  // Regional box — shows 4 seeded teams, regional winner highlighted
  function regionalBox(rname){
    if(!rname)return `<div style="border:1px dashed var(--br);border-radius:8px;padding:8px;min-width:100px;opacity:.35;background:var(--bg)"><div style="font-family:var(--fd);font-size:8px;color:var(--mu)">—</div></div>`;
    const reg=getBaseballReg(rname);
    const res=reg.results||[];
    const champ=res[2]||'';
    const teams=reg.teams;
    const shortName=rname.replace(' Regional','');
    const bk='br_'+rname;
    const rPicks=famMode?(S.bracketPicks[bk]||{})[SES.pid]||{}:{};
    const canPick=famMode&&(reg.published||reg.locked)&&!reg.locked;
    return `<div style="border:1px solid ${champ?'var(--ok)':'var(--br)'};border-radius:8px;padding:7px;background:var(--bg);min-width:100px">
      <div style="font-family:var(--fd);font-size:8px;font-weight:800;color:var(--ac);margin-bottom:5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(rname)}">${esc(shortName)}</div>
      <div style="display:flex;flex-direction:column;gap:3px">
        ${[0,1,2,3].map(ti=>{
          const t=teams[ti]?.name||'';const seed=ti+1;
          if(!t)return `<div style="height:22px;border:1px dashed var(--br);border-radius:4px;opacity:.3;display:flex;align-items:center;padding:0 5px"><span style="font-size:8px;color:var(--mu)">#${seed}</span></div>`;
          const isW=t===champ;
          const isPk=rPicks['gf']===t;
          const te=t.replace(/'/g,"\\'");
          return `<div style="display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:4px;border:1px solid ${isW?'var(--ok)':isPk?'var(--ac)':'var(--br)'};background:${isW?'rgba(61,214,140,.12)':isPk?'rgba(232,200,74,.1)':'transparent'};cursor:${canPick&&!champ?'pointer':'default'}" ${canPick&&!champ?`onclick="setBBRegChamp('${bk}','${te}')"`:''}>`+
            `<span style="font-family:var(--fd);font-size:7px;color:var(--ac);min-width:10px">#${seed}</span>`+
            `<span style="font-family:var(--fd);font-size:9px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</span>`+
            `${isW?'<span style="font-size:8px;color:var(--ok)">✓</span>':isPk?'<span style="font-size:8px;color:var(--ac)">●</span>':''}`+
            `</div>`;
        }).join('')}
      </div>
      ${champ?`<div style="font-family:var(--fd);font-size:8px;font-weight:800;color:var(--ok);margin-top:4px;text-align:center;padding-top:3px;border-top:1px solid var(--ok33,rgba(61,214,140,.2))">⬆ ${esc(champ)}</div>`:''}
    </div>`;
  }

  // SR box — 2 regionals side by side, SR result below
  function srBox(pi){
    const pair=pairs[pi]||['',''];
    const srRes=superResults[pi]||'';
    const regChamp1=pair[0]?getBaseballReg(pair[0]).results?.[2]||'':'';
    const regChamp2=pair[1]?getBaseballReg(pair[1]).results?.[2]||'':'';
    const bkSR='sr_'+pi;
    const srPick=famMode?((S.bracketPicks[bkSR]||{})[SES.pid]||{})['w']||'':'';
    const canPickSR=famMode&&regChamp1&&regChamp2&&!srRes;
    const rc1=regChamp1.replace(/'/g,"\\'"),rc2=regChamp2.replace(/'/g,"\\'");
    return `<div style="border:2px solid ${srRes?'var(--ok)':pair[0]&&pair[1]?'var(--ac)':'var(--br)'};border-radius:9px;padding:8px;background:var(--sf)">
      <div style="font-family:var(--fd);font-size:9px;font-weight:800;color:var(--ac);margin-bottom:6px">SR ${pi+1}</div>
      <div style="display:flex;gap:5px;margin-bottom:6px">
        ${regionalBox(pair[0])}
        ${regionalBox(pair[1])}
      </div>
      ${regChamp1||regChamp2?`<div style="border-top:1px solid var(--br);padding-top:5px">
        <div style="font-size:8px;color:var(--mu);margin-bottom:3px">Super Regional</div>
        <div style="display:flex;gap:3px">
          ${teamChip(regChamp1,false,srPick===regChamp1&&!srRes,canPickSR,`setBBSRPick(${pi},'${rc1}')`)}
          <span style="font-size:9px;color:var(--mu);padding:0 2px;align-self:center">vs</span>
          ${teamChip(regChamp2,false,srPick===regChamp2&&!srRes,canPickSR,`setBBSRPick(${pi},'${rc2}')`)}
        </div>
        ${srRes?`<div style="font-family:var(--fd);font-size:8px;font-weight:800;color:var(--ok);text-align:center;margin-top:3px">⬆ ${esc(srRes)}</div>`:''}
      </div>`:''}
    </div>`;
  }

  // CWS bracket box — 2 SR boxes + CWS R1 matchup
  function cwsBox(ci){
    const cp=cwsPairs[ci]||['',''];
    if(cp[0]===''&&cp[1]==='')return '';
    const srAi=parseInt(cp[0]),srBi=parseInt(cp[1]);
    if(isNaN(srAi)||isNaN(srBi))return '';
    const wA=superResults[srAi]||'';
    const wB=superResults[srBi]||'';
    const cwsRes=cwsResults[ci]||'';
    const bkCWS='cws_'+ci;
    const cwsPick=famMode?((S.bracketPicks[bkCWS]||{})[SES.pid]||{})['w']||'':'';
    const canPickCWS=famMode&&wA&&wB&&!cwsRes;
    const rA=wA.replace(/'/g,"\\'"),rB=wB.replace(/'/g,"\\'");
    return `<div style="border:2px solid var(--wn);border-radius:11px;padding:10px;background:var(--s2);margin-bottom:12px">
      <div style="font-family:var(--fd);font-size:11px;font-weight:800;color:var(--wn);margin-bottom:8px">CWS Game ${ci+1} — Omaha</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        ${srBox(srAi)}
        ${srBox(srBi)}
      </div>
      ${wA||wB?`<div style="border-top:1px solid rgba(232,154,74,.3);padding-top:6px">
        <div style="font-size:9px;color:var(--wn);font-family:var(--fd);font-weight:700;margin-bottom:4px">CWS R1</div>
        <div style="display:flex;gap:4px;align-items:center">
          ${teamChip(wA,false,cwsPick===wA&&!cwsRes,canPickCWS,`setBBCWSPick('${bkCWS}','${rA}')`,32)}
          <span style="font-size:9px;color:var(--mu)">vs</span>
          ${teamChip(wB,false,cwsPick===wB&&!cwsRes,canPickCWS,`setBBCWSPick('${bkCWS}','${rB}')`,32)}
        </div>
        ${cwsRes?`<div style="font-family:var(--fd);font-size:9px;font-weight:800;color:var(--ok);text-align:center;margin-top:4px">⬆ ${esc(cwsRes)} → Omaha</div>`:''}
        ${!famMode&&wA&&wB?`<div style="display:flex;gap:3px;margin-top:5px">
          <button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${cwsRes===wA?'border-color:var(--ok);color:var(--ok)':''}" onclick="setCWSResult(${ci},'${rA}')">${esc(wA)}</button>
          <button class="btn bg_ btn-sm" style="flex:1;font-size:9px;${cwsRes===wB?'border-color:var(--ok);color:var(--ok)':''}" onclick="setCWSResult(${ci},'${rB}')">${esc(wB)}</button>
          ${cwsRes?`<button class="btn bg_ btn-sm" style="font-size:9px" onclick="setCWSResult(${ci},'')">↩</button>`:''}
        </div>`:''}
      </div>`:''}
    </div>`;
  }

  const hasPairings=cwsPairs.some(cp=>cp[0]!==''&&cp[1]!=='');
  if(!hasPairings&&famMode)return `<div class="empty"><big>⚾</big>Bracket not set up yet.</div>`;
  if(!hasPairings)return `<div class="empty" style="padding:20px;text-align:center;color:var(--mu)">Set CWS pairings above to see bracket visual.</div>`;

  // CWS Bracket 1 = games 0+1, CWS Bracket 2 = games 2+3
  let h=`<div style="font-family:var(--fd);font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;color:var(--ac)">⚾ CWS Bracket</div>`;

        <div style="display:flex;gap:6px;justify-content:center">

    const rs=team.split("'").join("\\'");
    const click=canPk&&!won&&!lost?`onclick="setBFBaseballPick('${bk.split("'").join("\\'")}','${gameKey}','${rs}')"`:'';
    return `<div style="${sty}" ${click}>${logo}<div style="font-family:var(--fd);font-size:11px;font-weight:700;text-align:center">${esc(team)}</div>${seed?`<div style="font-size:9px;color:var(--ac)">#${esc(seed)}</div>`:''}<div style="font-size:9px;color:var(--mu)">${esc(rec||'')}</div>${picked&&!won?'<div style="font-size:9px;color:var(--ac);font-weight:700">MY PICK</div>':''}${won?'<div style="font-size:9px;color:var(--ok);font-weight:700">WINNER ✓</div>':''}</div>`;
  }

  h+=`<div class="bwrap"><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;max-width:500px">`;
  // Left side: Game 1 (#1 vs #4) and Game 2 (#2 vs #3)
  h+=`<div style="display:flex;flex-direction:column;gap:8px">`;
  h+=`<div><div style="font-size:10px;color:var(--mu);text-align:center;margin-bottom:4px">Game 1 · #1 vs #4</div>
    <div style="display:flex;gap:4px">${tBtn(teams[0].name,teams[0].rec,'1','g1',!r1done)}<div style="padding:4px;color:var(--mu);font-size:10px;display:flex;align-items:center">vs</div>${tBtn(teams[3].name,teams[3].rec,'4','g1',!r1done)}</div></div>`;

  h+=`</div>`;

  // Right: Regional Final
  h+=`<div><div style="font-size:10px;color:var(--mu);text-align:center;margin-bottom:4px">Regional Final</div>
    <div style="display:flex;gap:4px">

    </div></div>`;
  h+=`</div></div>`;

  return h;
}

  CHAMP_CATS.forEach(c=>{h+=`<th>${esc(c.label)}</th>`;});

  const maxTotal=Math.max(0,...S.participants.map(p=>{ensureChamps(p.id);return CHAMP_CATS.reduce((s,c)=>s+(parseInt(S.records.champs[p.id][c.key])||0),0);}));
  const sortedChamps=[...S.participants].map(p=>{ensureChamps(p.id);return p;}).sort((a,b)=>{
    const ta=CHAMP_CATS.reduce((s,c)=>s+(parseInt(S.records.champs[a.id]?.[c.key])||0),0);
    const tb=CHAMP_CATS.reduce((s,c)=>s+(parseInt(S.records.champs[b.id]?.[c.key])||0),0);
    return tb-ta;
  });
  sortedChamps.forEach(p=>{
    ensureChamps(p.id);
    const total=CHAMP_CATS.reduce((s,c)=>s+(parseInt(S.records.champs[p.id][c.key])||0),0);
    h+=`<tr><td><div style="display:flex;align-items:center;gap:6px"><div class="av ${p.isAdmin?'ava':''}">${esc(p.name[0])}</div>${esc(p.name)}</div></td>`;

      h+=`<td><input class="redit" type="number" min="0" max="99" value="${v}" onchange="setChamp('${p.id}','${c.key}',this.value)" title="Click to edit"></td>`;
    });
    h+=`<td><span class="${total===maxTotal&&total>0?'rchamp':total===0?'rzero':''}">${total||'—'}</span></td></tr>`;
  });
  return h+`</tbody></table></div><div style="font-size:11px;color:var(--mu);margin-top:6px">Click any number to edit. Saves automatically.</div>`;
}

// ALL-TIME RECORDS
function rAllTimeTable(editable){
  // Group seasons by sport, aggregate per player
  const rawSports=[...new Set(S.records.seasons.map(s=>s.sport))];
  const sports=[...SPORT_ORDER.filter(s=>rawSports.includes(s)),...rawSports.filter(s=>!SPORT_ORDER.includes(s)).sort()];
  let h='';
  sports.forEach(sport=>{
    const sportSeasons=S.records.seasons.filter(s=>s.sport===sport);
    // aggregate per player
    const byPlayer={};
    sportSeasons.forEach(season=>{
      season.entries.forEach(e=>{
        if(!byPlayer[e.pid])byPlayer[e.pid]={w:0,l:0};
        byPlayer[e.pid].w+=(parseInt(e.w)||0);
        byPlayer[e.pid].l+=(parseInt(e.l)||0);
      });
    });
    const rows=Object.entries(byPlayer).map(([pid,r])=>{
      const p=S.participants.find(p=>p.id===pid);
      const total=r.w+r.l;const pct=total?Math.round(r.w/total*100):0;
      return {p,w:r.w,l:r.l,pct,total};
    }).filter(r=>r.p&&r.total>0).sort((a,b)=>b.pct-a.pct||b.w-a.w);
    if(!rows.length)return;
    h+=`<div class="season-card" style="margin-bottom:12px">
      <div class="season-hdr"><div class="season-yr">${esc(sport)}</div></div>
      <div style="overflow-x:auto"><table class="rec-tbl"><thead><tr>
        <th style="text-align:left">Player</th><th>W</th><th>L</th><th>W%</th>
      </tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      const pctColor=i===0?'var(--ok)':i===rows.length-1&&rows.length>1?'var(--dn)':'var(--tx)';
      h+=`<tr><td><div style="display:flex;align-items:center;gap:5px"><span style="font-family:var(--fd);font-size:13px;font-weight:800;color:${i===0?'var(--ac)':'var(--mu)'};min-width:18px">${i+1}</span><div class="av ${r.p.isAdmin?'ava':''}">${esc(r.p.name[0])}</div>${esc(r.p.name)}</div></td>
      <td>${r.w}</td><td>${r.l}</td>
      <td style="color:${pctColor};font-weight:${i===0||i===rows.length-1?'800':'700'}">${r.total?r.pct+'%':'—'}</td>
      </tr>`;
    });
    h+=`</tbody></table></div></div>`;
  });
  return h||`<div class="empty"><big>📊</big>No history yet.</div>`;
}

function addSeason(){
  const yr=prompt('Year:');if(!yr?.trim())return;
  const sp=prompt('Sport/Category (e.g. CFB Regular, Bowl Season, March Madness):','')||'';
  const id='s'+Date.now();
  const entries=S.participants.map(p=>({pid:p.id,w:0,l:0,notes:''}));
  S.records.seasons.push({id,year:parseInt(yr)||new Date().getFullYear(),sport:sp.trim(),entries});
  sv();render();
}
function editSeasonMeta(id){
  const s=S.records.seasons.find(s=>s.id===id);if(!s)return;
  const yr=prompt('Year:',s.year);if(yr)s.year=parseInt(yr)||s.year;
  const sp=prompt('Sport/Category:',s.sport||'');if(sp!==null)s.sport=sp.trim();
  sv();render();
}
function delSeason(id){if(!confirm('Delete this season record?'))return;S.records.seasons=S.records.seasons.filter(s=>s.id!==id);sv();render();}
function setSStat(sid,pid,field,val){
  const season=S.records.seasons.find(s=>s.id===sid);if(!season)return;
  let entry=season.entries.find(e=>e.pid===pid);
  if(!entry){entry={pid,w:0,l:0,notes:''};season.entries.push(entry);}
  if(field==='notes')entry[field]=val;else entry[field]=Math.max(0,parseInt(val)||0);
  sv();
}

      <div style="font-family:var(--fd);font-size:14px;font-weight:800">${esc(entry.p.name)} (${entry.year})</div>
      <div style="font-size:12px;color:var(--tx)">${entry.w}-${entry.l} (${entry.pct}%)</div>
      ${extra?`<div style="font-size:10px;color:var(--mu)">${extra}</div>`:''}
    </div>`;
    h+=stat('🥇 Best Record',best);
    h+=stat('📉 Worst Record',worst);
    h+=stat('⬆️ Most Wins',mostW);
    h+=stat('⬇️ Least Wins',leastW);
    h+=`</div></div>`;
  });
  return h;
}

// ── Champion Pick Card (CFP, FCS, Baseball) ──
function rChampCard(bkey,title,teamList,sport){
  const picks=(S.bracketPicks[bkey]||{})[SES.pid]||{};
  const bracket=getBracket(bkey);
  if(!bracket)return '';
  // Find what the player picked as champion (winner of final game)
  const finalRound=bracket.rounds[bracket.rounds.length-1];
  const finalGame=finalRound?.games[0];
  if(!finalGame)return '';
  const myChamp=picks[finalGame.id]||'';
  const actualWinner=finalGame.winner||'';

  // Champion pick selector — show all teams the player has advancing
  // Collect all teams the player has picked to appear in the final
  const champKey='champ_'+bkey;
  const savedChamp=(S.bracketPicks[champKey]||{})[SES.pid]||'';
  const displayChamp=savedChamp||myChamp;

  const u=displayChamp?lu(displayChamp):null;
  const isCorrect=actualWinner&&displayChamp===actualWinner;
  const isWrong=actualWinner&&displayChamp&&displayChamp!==actualWinner;

  let h=`<div style="background:var(--sf);border:2px solid ${isCorrect?'var(--ok)':(isWrong?'var(--dn)':'rgba(232,200,74,.4)')};border-radius:12px;padding:14px;margin-top:14px;text-align:center">
    <div style="font-family:var(--fd);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--ac);margin-bottom:10px">🏆 ${esc(title)}</div>`;

  if(displayChamp){
    h+=`<div style="display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:12px 20px;border-radius:10px;background:${isCorrect?'rgba(61,214,140,.12)':(isWrong?'rgba(232,90,74,.1)':'rgba(232,200,74,.08)')};border:2px solid ${isCorrect?'var(--ok)':(isWrong?'var(--dn)':'var(--ac)')}">
      ${u?`<img src="${u}" crossorigin="anonymous" style="width:64px;height:64px;object-fit:contain" onerror="this.style.display='none'" alt="">`:
          `<div style="font-family:var(--fd);font-size:28px;font-weight:900;color:var(--ac)">${ab(displayChamp)}</div>`}
      <div style="font-family:var(--fd);font-size:14px;font-weight:800">${esc(displayChamp)}</div>
      ${isCorrect?`<div style="font-family:var(--fd);font-size:11px;font-weight:700;color:var(--ok)">✓ CORRECT!</div>`:''}
      ${isWrong?`<div style="font-family:var(--fd);font-size:11px;font-weight:700;color:var(--dn)">✗ Winner was ${esc(actualWinner)}</div>`:''}
      ${!actualWinner?`<div style="font-size:10px;color:var(--mu)">Your pick</div>`:''}
    </div>`;
  } else {
    h+=`<div style="color:var(--mu);font-size:12px;margin-bottom:10px">Pick your champion from the bracket above</div>`;
  }

  // Quick-pick champion from bracket picks
  const allPicked=new Set();
  bracket.rounds.forEach(round=>{
    round.games.forEach(g=>{const pk=picks[g.id];if(pk)allPicked.add(pk);});
  });
  if(allPicked.size>0&&!actualWinner){
    h+=`<div style="border-top:1px solid var(--br);padding-top:10px;margin-top:10px">
      <div style="font-family:var(--fd);font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;margin-bottom:7px">Your picks — tap to set champion</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center">`;
    [...allPicked].forEach(team=>{
      const tu=lu(team);const isSelected=team===savedChamp||(!savedChamp&&team===myChamp);
      const re=team.replace(/'/g,"\'");
      h+=`<div onclick="setChampPick('${champKey}','${re}')" style="cursor:pointer;border:2px solid ${isSelected?'var(--ac)':'var(--br)'};background:${isSelected?'rgba(232,200,74,.1)':'var(--bg)'};border-radius:7px;padding:5px 8px;text-align:center;transition:all .15s">
        ${tu?`<img src="${tu}" crossorigin="anonymous" style="width:24px;height:24px;object-fit:contain" onerror="this.style.display='none'" alt="">`:
            `<div style="font-family:var(--fd);font-size:9px;font-weight:700">${ab(team)}</div>`}
        <div style="font-family:var(--fd);font-size:8px;color:${isSelected?'var(--ac)':'var(--mu)'};margin-top:2px">${esc(team)}</div>
      </div>`;
    });
    h+=`</div></div>`;
  }
  return h+`</div>`;
}
function setChampPick(champKey,team){
  if(!S.bracketPicks[champKey])S.bracketPicks[champKey]={};
  S.bracketPicks[champKey][SES.pid]=team;UI.saved=true;sv();render();
}
function setView(v){S.view=v;UI.adding=false;UI.saved=false;render();}
function setSport(s){S.sport=s;UI.adding=false;UI.saved=false;UI.editGame=null;render();}

render();
</script>
